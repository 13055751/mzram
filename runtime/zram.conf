# Multi-level ZRAM profile configuration
#
# Three tiers by default. Each maps to a data profile; algorithm and idle
# threshold come from the profile table in service.sh unless overridden.
#
#   t<0..2>_PROFILE   hot_small | hot_large | cold_large | cold_small | kernel_text
#   t<0..2>_ALGO      override algorithm        (lz4 | lz4hc | zstd | zstdp | lzo)
#   t<0..2>_IDLE      override idle seconds
#   t<0..2>_SIZE_PCT  percent of RAM for the tier

t0_PROFILE=hot_small
t0_SIZE_PCT=6

t1_PROFILE=hot_large
t1_SIZE_PCT=12

t2_PROFILE=cold_large
t2_SIZE_PCT=10

# idle sweep: seconds after boot, and minimum interval between runs
IDLE_DELAY=300
IDLE_INTERVAL=21600
